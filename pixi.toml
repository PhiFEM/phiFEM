[workspace]
authors = ["Raphaël Bulle <rbulle@tutanota.com>"]
channels = ["conda-forge"]
name = "phiFEM"
platforms = ["linux-64"]
version = "0.7.0"

[environments]
test = ["test"]
dev = {features = ["dev"], no-default-feature = true}

[dependencies]
python = ">=3.9.0"
numpy = ">=1.21"
fenics-dolfinx = "==0.9.0"
mpich = ">=4.3.2,<5"

[pypi-dependencies]
phifem = "==0.7.1.dev2"

[feature.dev.dependencies]
python = ">=3.9.0"
numpy = ">=1.21"
fenics-dolfinx = "==0.10.0"
mpich = ">=4.3.2,<5"
packaging = ">=26.2,<27"

[feature.dev.pypi-dependencies]
pydouillaj = { git = "https://gitlab.com/rbulle/pydouillaj.git" }
matplotlib = ">=3.10.9, <4"

[feature.dev.activation]
# scripts = ["dev-activation.sh"]

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
build = "python -m build"
local_install = "python -m pip install -e $(pwd)"
install = [{task = "build"}, {task = "local_install"}]
test = "pytest"
