[workspace]
authors = ["Raphaël Bulle <rbulle@tutanota.com>"]
channels = ["conda-forge"]
name = "phiFEM"
platforms = ["linux-64"]
version = "0.7.0"

[environments]
test = ["test"]

[dependencies]
python = ">=3.9.0"
numpy = ">=1.21"
fenics-dolfinx = "==0.9.0"
mpich = ">=4.3.2,<5"

[pypi-dependencies]
phifem = "==0.7.1.dev2"

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = "pytest"