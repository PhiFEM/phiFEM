[workspace]
authors = ["Raphaël Bulle <rbulle@tutanota.com>"]
channels = ["conda-forge"]
name = "phiFEM"
platforms = ["linux-64"]
version = "0.7.0"

[environments]
dev = ["dev"]

[dependencies]
python = ">=3.9.0"
numpy = ">=1.21"
fenics-dolfinx = "==0.9.0"
mpich = ">=4.3.2,<5"

[feature.dev.pypi-dependencies]
pydouillaj = { git = "https://gitlab.com/rbulle/pydouillaj.git" }
matplotlib = "*"

[feature.dev.activation]
scripts = ["update_pythonpath.sh"]

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
