[workspace]
authors = ["Raphaël Bulle <rbulle@tutanota.com>"]
channels = ["conda-forge"]
name = "phiFEM"
platforms = ["linux-64"]
version = "0.8.0"

[environments]
dev = ["dev"]

[dependencies]
numpy = ">=1.21"
pyaml = ">=26.7.0,<27"
fenics-dolfinx = ">=0.11.0,<0.12"

[feature.dev.pypi-dependencies]
pydouillaj = { git = "https://gitlab.com/rbulle/pydouillaj.git" }
matplotlib = "*"

[feature.dev.activation]
scripts = ["update_pythonpath.sh"]

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
