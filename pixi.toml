[workspace]
authors = ["Raphaël Bulle <rbulle@tutanota.com>"]
channels = ["conda-forge"]
name = "phiFEM"
platforms = ["linux-64"]
version = "0.8.0"

[environments]
dev = ["dev"]

[dependencies]
numpy = ">=1.21"
pyaml = ">=26.7.0,<27"
fenics-dolfinx = ">=0.11.0,<0.12"

[feature.dev.pypi-dependencies]
matplotlib = "*"
ngsolve = ">=6.2.2608, <7"
ngspetsc = ">=0.3.0, <0.4"

[feature.dev.activation]
scripts = ["update_pythonpath.sh"]

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
